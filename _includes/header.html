<header class="site-header bilingual-site-header" role="banner">
  <a class="friend-link" href="https://sallykyang.github.io/" target="_blank" rel="noopener" lang="en">An aspiring economist ↗</a>
  <div class="wrapper bilingual-header">
    {% if page.lang == 'zh-CN' %}
      <a class="site-title" rel="author" href="{{ '/zh/' | relative_url }}">司谛文</a>
    {% else %}
      <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    {% endif %}

    <nav class="header-navigation" aria-label="{% if page.lang == 'zh-CN' %}主导航{% else %}Main navigation{% endif %}">
      {% if page.lang == 'zh-CN' %}
        <a href="{{ '/zh/' | relative_url }}">关于我</a>
      {% else %}
        <a href="{{ '/' | relative_url }}">About Me</a>
      {% endif %}
    </nav>

    <nav class="language-switch" aria-label="Language / 语言">
      <a href="{{ '/' | relative_url }}" lang="en" hreflang="en"{% if page.lang != 'zh-CN' %} aria-current="page"{% endif %}>English</a>
      <span aria-hidden="true">/</span>
      <a href="{{ '/zh/' | relative_url }}" lang="zh-CN" hreflang="zh-CN"{% if page.lang == 'zh-CN' %} aria-current="page"{% endif %}>中文</a>
    </nav>
  </div>
</header>
